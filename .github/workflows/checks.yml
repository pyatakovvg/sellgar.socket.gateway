name: socket-gateway checks and release candidate

on:
  pull_request:
    branches: [development, 'release/**', master]
  push:
    branches: ['release/**']

permissions:
  contents: read

concurrency:
  group: socket-gateway-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    uses: sellgar/sellgar.infrastructure/.github/workflows/test-application.yml@delivery-v0.7.0
    secrets:
      SUBMODULES_READ_TOKEN: ${{ secrets.SUBMODULES_READ_TOKEN }}
    with:
      source-revision: ${{ github.sha }}

  images:
    needs: unit
    uses: sellgar/sellgar.infrastructure/.github/workflows/build-service.yml@delivery-v0.7.0
    permissions:
      contents: write
      packages: write
    secrets:
      SUBMODULES_READ_TOKEN: ${{ secrets.SUBMODULES_READ_TOKEN }}
    with:
      release-name: socket-gateway
      migrations: true
      publish: ${{ github.event_name == 'push' }}
